plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}

application {
    mainClass = 'server.KeyServer'
}

test {
    useJUnitPlatform()
}

// Задача для запуска сервера
task runServer(type: JavaExec) {
    group = 'application'
    description = 'Run the Key Server'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'server.KeyServer'
    args = ['8080', '4', 'keys/issuer.p12', 'My CA']
}
// Задача для запуска клиента
task runClient(type: JavaExec) {
    group = 'application'
    description = 'Run the Key Client'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'client.KeyClient'

    if (project.hasProperty('clientArgs')) {
        args clientArgs.split()
    } else {
        args = ['testclient', 'localhost', '8080']
    }
}